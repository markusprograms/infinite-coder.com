<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>New logo</title>
        <style>
            #logo {
                display: flex; 
            }
        </style>
    </head>
    <body>
        <div id="logo">
            <canvas class="logo-canvas" id="left-side"></canvas>
            <canvas class="logo-canvas" id="right-side"></canvas>
        </div>
        <b>FPS: </b><span id="fps-counter"></span>
    </body>
    <script>
        const LOGO = {
            size: 600, // In pixels
            visibleInstanceCount: null, // Calculated later based on logo size
            radiusX: 0.6,
            radiusY: 0.3,
            lightOffset: null, // Calculated later based on logo size
            tau2: Math.PI * 4,
            darkLayer: {
                r: 0.10, 
                g: 0.30, 
                b: 0.10
            },
            lightLayer: {
                r: 0.32, 
                g: 0.9, 
                b: 0.32
            }, 
            perfMultiplier: 0.001666 // Larger number = faster animation
        };
        LOGO.visibleInstanceCount = 720 / 600 * LOGO.size; // Visible instances across both canvases
        LOGO.lightOffset = 0.02 * 600 / LOGO.size; 

        function createProgram(gl, vertexShaderText, fragmentShaderText) {
            /**
             * A function that returns a webglprogram object given the shader text
             */

            // These lines create and compile the shaders
            vertexShader = gl.createShader(gl.VERTEX_SHADER);
            fragmentShader = gl.createShader(gl.FRAGMENT_SHADER);
            gl.shaderSource(vertexShader, vertexShaderText);
            gl.shaderSource(fragmentShader, fragmentShaderText);
            gl.compileShader(vertexShader);
            gl.compileShader(fragmentShader);
            if (!gl.getShaderParameter(vertexShader, gl.COMPILE_STATUS)) {
                console.error(gl.getShaderInfoLog(vertexShader));
            }
            
            // These lines create the program and attaches the shaders
            let program = gl.createProgram();
            gl.attachShader(program,vertexShader);
            gl.attachShader(program,fragmentShader);
            gl.linkProgram(program);
            
            return program;
        }

        let webglNotSupportedWarningDisplayed = false; 

        const vertexSize = 0.1;
        const verts = [
            // Square
            -vertexSize, -vertexSize, 
            vertexSize, -vertexSize,
            -vertexSize, vertexSize, 

            vertexSize, -vertexSize, 
            vertexSize, vertexSize, 
            -vertexSize, vertexSize
        ];

        const vertexShaderCode = `#version 300 es
            precision mediump float;

            uniform vec2 lightDir;
            uniform float instanceOffset;
            
            in vec2 vertPos; // This is the position of the vertices, and will be passed in from the buffers later
            out vec2 localPos;
            out float brightness; 
            
            void main() {          
                localPos = vertPos / 0.1;

                float i = float(gl_InstanceID) + instanceOffset;
                float count = ${LOGO.visibleInstanceCount.toFixed(1)};

                float angle = (i / count) * ${LOGO.tau2}; 

                float x = cos(angle * 0.5) * ${LOGO.radiusX}; // Also lowers the cos frequency to half
                float y = sin(angle) * ${LOGO.radiusY};

                vec2 center = vec2(x, y);

                brightness = dot(localPos, lightDir);
                brightness = brightness * 0.5 + 0.5;

                gl_Position =
                    vec4(
                        vertPos + center,
                        0,
                        1
                    );
            }
        `;

        const fragmentShaderCode = `#version 300 es
            
            precision mediump float;

            in vec2 localPos;
            in float brightness;
            out vec4 fragColor;

            void main() {
                float d = dot(localPos, localPos); // d = sqrt(localPos.x * localPos.x, localPos.y * localPos.y)

                if (d > 1.0) // If the distance from the center is greater than the radius, discard the fragment
                    discard;

                vec3 dark = vec3(
                    ${LOGO.darkLayer.r},
                    ${LOGO.darkLayer.g},
                    ${LOGO.darkLayer.b}
                );

                vec3 light = vec3(
                    ${LOGO.lightLayer.r},
                    ${LOGO.lightLayer.g},
                    ${LOGO.lightLayer.b}
                );

                fragColor = vec4(
                    mix(dark, light, brightness),
                    1.0
                );
            }
        `;

        function Vector(x, y) {
            this.x = x; 
            this.y = y; 
        }

        Vector.prototype.divide = function(scalar) {
            return new Vector(this.x / scalar, this.y / scalar);
        }

        Vector.prototype.magnitude = function() {
            return Math.sqrt(this.x * this.x + this.y * this.y);
        }

        Vector.prototype.normalize = function() {
            return this.divide(this.magnitude());
        }

        function Renderer(canvas, size, offsetX, instanceOffset, instanceCount) {
            /**
             * Creates a WebGL context for the provided canvas, sets the viewport, creates a WebGL program, supplies vertex data to the program
             * and configures instance offset.
             */

            let gl = canvas.getContext("webgl2", {
                premultipliedAlpha: false
            });

            if (!gl && !webglNotSupportedWarningDisplayed) {
                alert("Your browser does not support WebGL2!");
            }

            // Sets background color (but doesn't use it yet)
            gl.clearColor(0, 0, 0, 0); // Fully transparent

            // Enable alpha blending
            gl.enable(gl.BLEND);
            gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

            // Parameters: offsetX, offsetY, width, height
            gl.viewport(offsetX, 0, size, size);

            // Create the program with the fetched shader codes
            let program = createProgram(gl, vertexShaderCode, fragmentShaderCode);

            // Use the created program
            gl.useProgram(program);

            // Creates the buffer
            let buffer = gl.createBuffer();

            // Tells WebGL that we are performing operations on this specific buffer
            // gl.ARRAY_BUFFER indicates that this buffer is for vertex data
            gl.bindBuffer(gl.ARRAY_BUFFER, buffer);

            // Sets data in the buffer using the mesh
            // The inputted data must be a Float32Aray
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(verts), gl.STATIC_DRAW);

            // Gets the location of the attribute from the WebGLProgram
            // The name (here it's "vertPos") must match what's defined in the vertex shader (the shader states "in vec2 vertPos;")
            let vertPosLocation = gl.getAttribLocation(program, "vertPos");

            // Enable the vertex attribute
            gl.enableVertexAttribArray(vertPosLocation);

            // Values in attribute. 2 values(x and y coords) are used in the "vertPos" attribute
            let via = 2;

            // Bytes per vertex. The total amount of values per a vertex (here it's 2) multiplied by 4 (which is the amount of bytes in a float32)
            let bpv = 8;

            // Current attribute offset bytes. Here, the "vertPos" attribute is the first attribute, so 0 values before it
            // The amount of bytes is the value multiplied by 4 (which is the amount of bytes in a float32)
            let caob = 0;

            // Tells WebGL how to get values out of the supplied buffer
            gl.vertexAttribPointer(vertPosLocation, via, gl.FLOAT, gl.FALSE, bpv, caob);

            // Set the instance offset
            let instanceOffsetLoc = gl.getUniformLocation(program, "instanceOffset");
            gl.uniform1f(instanceOffsetLoc, instanceOffset); 

            this.gl = gl;
            this.lightDirPos = gl.getUniformLocation(program, "lightDir");
            this.instanceCount = instanceCount; 
        }
        Renderer.prototype.render = function(perf) {
            /**
             * Renders on the canvas
             */

            // Clears the color buffer bits, showing the background color
            this.gl.clear(this.gl.COLOR_BUFFER_BIT);

            // Calculates and sets the "lightDir" variable in the WebGL program
            let time = perf * LOGO.perfMultiplier; 
            let lightDir = new Vector(
                Math.sin(time),
                Math.cos(time)
            );
            lightDir = lightDir.normalize();
            this.gl.uniform2fv(this.lightDirPos, [lightDir.x, lightDir.y]);

            // Draws the logo
            this.gl.drawArraysInstanced(
                this.gl.TRIANGLES,
                0,
                6, // Number of vertices
                this.instanceCount
            );
        }

        // Fetches the canvas elements
        let leftSide = document.getElementById("left-side"); 
        let rightSide = document.getElementById("right-side");

        // Resizes the canvases and the container
        leftSide.width = LOGO.size * (7 / 10);
        leftSide.height = LOGO.size; 

        rightSide.width = LOGO.size * (3 / 10);
        rightSide.height = LOGO.size; 

        document.getElementById("logo").style.width = LOGO.size + "px";
        document.getElementById("logo").style.height = LOGO.size + "px";

        let leftSideRenderer = new Renderer(leftSide, leftSide.height, 0, LOGO.visibleInstanceCount / 720 * 60, LOGO.visibleInstanceCount / 720 * 610);
        let rightSideRenderer = new Renderer(rightSide, leftSide.height, -leftSide.width, LOGO.visibleInstanceCount / 720 * -100, LOGO.visibleInstanceCount / 720 * 230);

        let frames = 0;
        let lastTime = performance.now();
        const fpsCounter = document.getElementById("fps-counter");

        function draw() {
            let perf = performance.now();

            frames ++;

            if (perf - lastTime >= 1000) {
                fpsCounter.innerHTML = frames; 
                frames = 0;
                lastTime = perf;
            }

            leftSideRenderer.render(perf);
            rightSideRenderer.render(perf); 

            requestAnimationFrame(draw);
        }

        requestAnimationFrame(draw);
    </script>
</html>
