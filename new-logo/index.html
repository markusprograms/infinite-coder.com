<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>New logo</title>
        <style>
            #canvas {
                position: absolute;
                top: 0; 
                left: 0;
            }
            #canvas2 {
                position: absolute;
                top: 0; 
                left: 350px; 
            }
        </style>
    </head>
    <body>
        <canvas id='canvas' width='350' height='500'></canvas>
        <canvas id='canvas2' width='150' height='500'></canvas>
    </body>
    <script>
        // Fetches the canvas element
        let canvas = document.getElementById('canvas'); 

        // The webgl API
        let gl = canvas.getContext('webgl2');

        // If WebGL2 is not supported
        if (!gl) {
            alert('Your browser does not support WebGL2!');
        } 

        //color values are in RGBA format. each value is in the range of 0-1
        gl.clearColor(0.1,0,0,1);

        //clears the color buffer bits, showing the background color
        gl.clear(gl.COLOR_BUFFER_BIT);

        //sets the viewport. the first 2 params are the x and y offset values of the viewport from the lower left corner. the last 2 are the width and height
        //in webgl, the up direction are positive y values
        gl.viewport(0,0,500,500);

        //a function that returns a webglprogram object given the shader text
        function createProgram(vshText,fshText){
            
            //these lines create and compile the shaders
            vsh=gl.createShader(gl.VERTEX_SHADER)
            fsh=gl.createShader(gl.FRAGMENT_SHADER)
            gl.shaderSource(vsh,vshText)
            gl.shaderSource(fsh,fshText)
            gl.compileShader(vsh)
            gl.compileShader(fsh)
            
            //these lines create the program and attaches the shaders
            let p=gl.createProgram()
            gl.attachShader(p,vsh)
            gl.attachShader(p,fsh)
            gl.linkProgram(p)
            
            return p
        }

        let vertexShaderCode=`#version 300 es
    
            //this line tells the shader what the precision is. This is needed in both the shaders. 'lowp' means low, 'mediump' means medium, and 'highp' is high.
            precision mediump float;

            uniform float time;
            
            //this is the position of the vertices, and will be passed in from the buffers later
            in vec2 vertPos;

            out vec2 localPos;

            flat out int layer;
            
            void main(){          
                localPos = vertPos / 0.1;

                float i = float(gl_InstanceID);
                float count = 720.0;

                float angle = (i / count) * 12.566370614; // 4π

                float x = cos(angle * 0.5) * 0.6;
                float y = sin(angle) * 0.3;

                /*float x = cos(i * 0.5) * 0.6;
                float y = sin(i) * 0.3;    */   
                
                bool light = gl_VertexID >= 6;

                layer = light ? 1 : 0;

                if (gl_InstanceID == 719 && light) {
                    layer = 2;
                }

                vec2 center = vec2(x, y);
                if (light) {
                    center += vec2(
                        cos(time),
                        sin(time)
                    ) * 0.01;
                }

                gl_Position =
                    vec4(
                        vertPos + center,
                        0,
                        1
                    );
            }
        `

        let fragmentShaderCode=`#version 300 es
            
            precision mediump float;

            in vec2 localPos;
            
            //In WebGL1, you set gl_FragColor, just like gl_Position, but in WebGL2, you use an 'out' vec4 statement, with the name of the output. The name can't be 'gl_FragColor'
            out vec4 fragColor;

            flat in int layer;
            
            void main(){
                if (layer == 2)
                    discard;

                float d = dot(localPos, localPos);

                if (d > 1.0)
                    discard;

                if (layer == 0) {
                    fragColor = vec4(
                        0.12,
                        0.35,
                        0.12,
                        1.0
                    );
                }
                else {
                    fragColor = vec4(
                        0.24,
                        0.70,
                        0.24,
                        1.0
                    );
                }
            }
        `

        // Create the program with the fetched shader codes
        let program = createProgram(vertexShaderCode, fragmentShaderCode);

        // Use the created program
        gl.useProgram(program);

        //the vertices of the triangle. the coords are in the range of -1 to 1, for both the axes. canvas width and height don't matter
        //the vertex positions are stored together. in this case, the format is x1,y1,x2,y2,x3,y3
        
        const r = 1;
        let verts = [
            // Dark quad
            -r, -r, 
            r, -r,
            -r, r, 

            r, -r, 
            r, r, 
            -r, r, 

            // Light quad
            -r, -r, 
            r, -r,
            -r, r, 

            r, -r, 
            r, r, 
            -r, r
        ]


        //creates the buffer
        let buffer=gl.createBuffer()

        //tells webgl that we are performing stuff on this specific buffer
        //gl.ARRAY_BUFFER indicates that this buffer is for vertex data
        gl.bindBuffer(gl.ARRAY_BUFFER,buffer)

        //sets data in the buffer using the mesh. the inputted data must be a Float32Aray
        gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(verts),gl.STATIC_DRAW)

        //gets the location of the attribute from the WebGLProgram
        //the name(here it's "vertPos") must match what's defined in the vertex shader(the shader states "in vec2 vertPos;")
        let vertPosLocation=gl.getAttribLocation(program,'vertPos')

        //enable the vertex attribute
        gl.enableVertexAttribArray(vertPosLocation)

        //values in attribute. 2 values(x and y coords) are used in the "vertPos" attribute
        let via=2

        //bytes per vertex. the total amount of values per a vertex(here it's 2) multiplied by 4(which is the amount of bytes in a float32)
        let bpv=8

        //current attribute offset bytes. here, the "vertPos" attribute is the first attribute, so 0 values before it. the amount of bytes is the value multiplied by 4(which is the amount of bytes in a float32)
        let caob=0

        //tells webgl how to get values out of the supplied buffer
        gl.vertexAttribPointer(vertPosLocation,via,gl.FLOAT,gl.FALSE,bpv,caob)

        const timeLoc = gl.getUniformLocation(program, "time");

        /*function draw() {
            //clears the color buffer bits, showing the background color
            gl.clear(gl.COLOR_BUFFER_BIT);

            gl.uniform1f(timeLoc, performance.now() * 0.001666);

            gl.drawArraysInstanced(
                gl.TRIANGLES,
                0,
                12,
                720
            );

            requestAnimationFrame(draw);
        }

        requestAnimationFrame(draw);*/
    </script>

    <script>
        // Fetches the canvas element
        let canvas2 = document.getElementById('canvas2'); 

        // The webgl API
        let gl2 = canvas2.getContext('webgl2');

        // If WebGL2 is not supported
        if (!gl2) {
            alert('Your browser does not support WebGL2!');
        } 

        //color values are in RGBA format. each value is in the range of 0-1
        gl2.clearColor(0.1,0,0,1);

        //clears the color buffer bits, showing the background color
        gl2.clear(gl2.COLOR_BUFFER_BIT);

        //sets the viewport. the first 2 params are the x and y offset values of the viewport from the lower left corner. the last 2 are the width and height
        //in webgl, the up direction are positive y values
        gl2.viewport(-canvas.width,0,500,500);

        //a function that returns a webglprogram object given the shader text
        function createProgram2(vshText,fshText){
            
            //these lines create and compile the shaders
            vsh=gl2.createShader(gl2.VERTEX_SHADER)
            fsh=gl2.createShader(gl2.FRAGMENT_SHADER)
            gl2.shaderSource(vsh,vshText)
            gl2.shaderSource(fsh,fshText)
            gl2.compileShader(vsh)
            gl2.compileShader(fsh)
            
            //these lines create the program and attaches the shaders
            let p=gl2.createProgram()
            gl2.attachShader(p,vsh)
            gl2.attachShader(p,fsh)
            gl2.linkProgram(p)
            
            return p
        }

        let vertexShaderCode2=`#version 300 es
    
            //this line tells the shader what the precision is. This is needed in both the shaders. 'lowp' means low, 'mediump' means medium, and 'highp' is high.
            precision mediump float;

            uniform float time;
            
            //this is the position of the vertices, and will be passed in from the buffers later
            in vec2 vertPos;

            out vec2 localPos;

            flat out int layer;
            
            void main(){          
                localPos = vertPos / 0.1;

                float i = float(gl_InstanceID) - 150.0;
                float count = 720.0;

                float angle = (i / count) * 12.566370614; // 4π

                float x = cos(angle * 0.5) * 0.6;
                float y = sin(angle) * 0.3;

                /*float x = cos(i * 0.5) * 0.6;
                float y = sin(i) * 0.3;    */   
                
                bool light = gl_VertexID >= 6;

                layer = light ? 1 : 0;

                if (gl_InstanceID == 719 && light) {
                    layer = 2;
                }

                vec2 center = vec2(x, y);
                if (light) {
                    center += vec2(
                        cos(time),
                        sin(time)
                    ) * 0.01;
                }

                gl_Position =
                    vec4(
                        vertPos + center,
                        0,
                        1
                    );
            }
        `

        let fragmentShaderCode2=`#version 300 es
            
            precision mediump float;

            in vec2 localPos;
            
            //In WebGL1, you set gl_FragColor, just like gl_Position, but in WebGL2, you use an 'out' vec4 statement, with the name of the output. The name can't be 'gl_FragColor'
            out vec4 fragColor;

            flat in int layer;
            
            void main(){
                if (layer == 2)
                    discard;

                float d = dot(localPos, localPos);

                if (d > 1.0)
                    discard;

                if (layer == 0) {
                    fragColor = vec4(
                        0.12,
                        0.35,
                        0.12,
                        1.0
                    );
                }
                else {
                    fragColor = vec4(
                        0.24,
                        0.70,
                        0.24,
                        1.0
                    );
                }
            }
        `

        // Create the program with the fetched shader codes
        let program2 = createProgram2(vertexShaderCode2, fragmentShaderCode2);

        // Use the created program
        gl2.useProgram(program2);

        //the vertices of the triangle. the coords are in the range of -1 to 1, for both the axes. canvas width and height don't matter
        //the vertex positions are stored together. in this case, the format is x1,y1,x2,y2,x3,y3
        
        const r2 = 1;
        let verts2 = [
            // Dark quad
            -r2, -r2, 
            r2, -r2,
            -r2, r2, 

            r2, -r2, 
            r2, r2, 
            -r2, r2, 

            // Light quad
            -r2, -r2, 
            r2, -r2,
            -r2, r2, 

            r2, -r2, 
            r2, r2, 
            -r2, r2
        ]


        //creates the buffer
        let buffer2=gl2.createBuffer()

        //tells webgl that we are performing stuff on this specific buffer
        //gl.ARRAY_BUFFER indicates that this buffer is for vertex data
        gl2.bindBuffer(gl2.ARRAY_BUFFER,buffer2)

        //sets data in the buffer using the mesh. the inputted data must be a Float32Aray
        gl2.bufferData(gl2.ARRAY_BUFFER,new Float32Array(verts2),gl2.STATIC_DRAW)

        //gets the location of the attribute from the WebGLProgram
        //the name(here it's "vertPos") must match what's defined in the vertex shader(the shader states "in vec2 vertPos;")
        let vertPosLocation2=gl2.getAttribLocation(program2,'vertPos')

        //enable the vertex attribute
        gl2.enableVertexAttribArray(vertPosLocation2)

        //values in attribute. 2 values(x and y coords) are used in the "vertPos" attribute
        let via2=2

        //bytes per vertex. the total amount of values per a vertex(here it's 2) multiplied by 4(which is the amount of bytes in a float32)
        let bpv2=8

        //current attribute offset bytes. here, the "vertPos" attribute is the first attribute, so 0 values before it. the amount of bytes is the value multiplied by 4(which is the amount of bytes in a float32)
        let caob2=0

        //tells webgl how to get values out of the supplied buffer
        gl2.vertexAttribPointer(vertPosLocation2,via2,gl2.FLOAT,gl2.FALSE,bpv2,caob2)

        const timeLoc2 = gl2.getUniformLocation(program2, "time");

        function draw() {
            let perf = performance.now();

            //clears the color buffer bits, showing the background color
            gl.clear(gl.COLOR_BUFFER_BIT);

            gl.uniform1f(timeLoc, perf * 0.001666);

            gl.drawArraysInstanced(
                gl.TRIANGLES,
                0,
                12,
                720
            );

            //clears the color buffer bits, showing the background color
            gl2.clear(gl2.COLOR_BUFFER_BIT);

            gl2.uniform1f(timeLoc2, perf * 0.001666);

            gl2.drawArraysInstanced(
                gl2.TRIANGLES,
                0,
                12,
                720
            );

            requestAnimationFrame(draw);
        }

        requestAnimationFrame(draw);
    </script>
